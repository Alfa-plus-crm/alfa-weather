name: ALFA WEATHER Morning Forecast

on:
  workflow_dispatch:
  schedule:
    # 07:00 Moscow time (UTC+3)
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  group: alfa-weather-morning-forecast
  cancel-in-progress: false

jobs:
  send-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          for name in TELEGRAM_BOT_TOKEN SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done
          echo "All required secrets are present."

      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Build and send weather forecast to subscribers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python <<'PY'
          import os
          import sys
          import html
          import time
          import requests
          from datetime import datetime
          from zoneinfo import ZoneInfo

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          def get_with_retries(url, *, params=None, headers=None, timeout=(15, 60), label="request"):
              last_error = None
              for attempt in range(1, 4):
                  try:
                      response = requests.get(url, params=params, headers=headers, timeout=timeout)
                      response.raise_for_status()
                      return response
                  except requests.RequestException as exc:
                      last_error = exc
                      print(f"{label}: attempt {attempt}/3 failed: {exc}")
                      if attempt < 3:
                          time.sleep(attempt * 3)
              raise RuntimeError(f"{label} failed after 3 attempts: {last_error}")

          supabase_url = os.environ["SUPABASE_URL"].strip().rstrip("/")
          if supabase_url.endswith("/rest/v1"):
              supabase_url = supabase_url[:-8]

          anon_key = os.environ["SUPABASE_ANON_KEY"]
          service_key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          fallback_chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          settings_headers = {
              "apikey": anon_key,
              "Authorization": f"Bearer {anon_key}",
              "Accept": "application/json",
              "Accept-Profile": "public",
          }

          try:
              settings_response = get_with_retries(
                  f"{supabase_url}/rest/v1/weather_settings",
                  headers=settings_headers,
                  params={"select": "city,timezone", "id": "eq.1", "limit": "1"},
                  timeout=(15, 30),
                  label="Supabase settings request",
              )
              settings_rows = settings_response.json()
          except Exception as exc:
              fail(f"Could not read Supabase weather settings: {exc}")

          if not settings_rows:
              fail("No row with id=1 found in public.weather_settings.")

          settings = settings_rows[0]
          city = settings.get("city") or "Москва"
          timezone = settings.get("timezone") or "Europe/Moscow"

          try:
              ZoneInfo(timezone)
          except Exception:
              print(f"Invalid timezone {timezone}; using Europe/Moscow.")
              timezone = "Europe/Moscow"

          # Read only active subscribers. The service-role key stays in GitHub Secrets.
          subscriber_headers = {
              "apikey": service_key,
              "Authorization": f"Bearer {service_key}",
              "Accept": "application/json",
              "Accept-Profile": "public",
          }

          try:
              subscribers_response = get_with_retries(
                  f"{supabase_url}/rest/v1/telegram_subscribers",
                  headers=subscriber_headers,
                  params={
                      "select": "chat_id",
                      "is_active": "eq.true",
                      "order": "created_at.asc",
                  },
                  timeout=(15, 30),
                  label="Supabase subscribers request",
              )
              subscribers = subscribers_response.json()
          except Exception as exc:
              fail(f"Could not read Telegram subscribers: {exc}")

          chat_ids = []
          seen = set()
          for subscriber in subscribers:
              value = str(subscriber.get("chat_id", "")).strip()
              if value and value not in seen:
                  chat_ids.append(value)
                  seen.add(value)

          # Keep the old single-chat delivery as a fallback if no one has subscribed yet.
          if not chat_ids and fallback_chat_id:
              print("No active subscribers found; using TELEGRAM_CHAT_ID fallback.")
              chat_ids = [fallback_chat_id]

          if not chat_ids:
              print("No active subscribers. Nothing to send.")
              sys.exit(0)

          try:
              geocode_response = get_with_retries(
                  "https://geocoding-api.open-meteo.com/v1/search",
                  params={"name": city, "count": 1, "language": "ru", "format": "json"},
                  timeout=(15, 60),
                  label="Open-Meteo geocoding",
              )
              geocode = geocode_response.json()
          except Exception as exc:
              fail(f"Could not find coordinates for city '{city}': {exc}")

          places = geocode.get("results") or []
          if not places:
              fail(f"Open-Meteo could not find city: {city}")

          latitude = places[0]["latitude"]
          longitude = places[0]["longitude"]
          resolved_city = places[0].get("name") or city

          weather_params = {
              "latitude": latitude,
              "longitude": longitude,
              "current": (
                  "temperature_2m,apparent_temperature,relative_humidity_2m,"
                  "precipitation,weather_code,wind_speed_10m"
              ),
              "daily": (
                  "weather_code,temperature_2m_max,temperature_2m_min,"
                  "precipitation_probability_max"
              ),
              "forecast_days": 1,
              "timezone": timezone,
          }

          try:
              weather_response = get_with_retries(
                  "https://api.open-meteo.com/v1/forecast",
                  params=weather_params,
                  timeout=(15, 60),
                  label="Open-Meteo forecast",
              )
              weather = weather_response.json()
          except Exception as exc:
              fail(f"Could not fetch Open-Meteo forecast: {exc}")

          current = weather.get("current", {})
          daily = weather.get("daily", {})

          def number(value, suffix=""):
              if value is None:
                  return "—"
              try:
                  return f"{round(float(value))}{suffix}"
              except (TypeError, ValueError):
                  return "—"

          descriptions = {
              0: "Ясно", 1: "Преимущественно ясно", 2: "Переменная облачность",
              3: "Пасмурно", 45: "Туман", 48: "Изморозь", 51: "Лёгкая морось",
              53: "Морось", 55: "Сильная морось", 56: "Ледяная морось",
              57: "Сильная ледяная морось", 61: "Небольшой дождь", 63: "Дождь",
              65: "Сильный дождь", 66: "Ледяной дождь", 67: "Сильный ледяной дождь",
              71: "Небольшой снег", 73: "Снег", 75: "Сильный снег", 77: "Снежные зёрна",
              80: "Кратковременный дождь", 81: "Ливень", 82: "Сильный ливень",
              85: "Снегопад", 86: "Сильный снегопад", 95: "Гроза",
              96: "Гроза с небольшим градом", 99: "Гроза с сильным градом",
          }

          code = current.get("weather_code")
          description = descriptions.get(code, "Погодные условия")
          temperature = number(current.get("temperature_2m"), "°C")
          feels_like = number(current.get("apparent_temperature"), "°C")
          humidity = number(current.get("relative_humidity_2m"), "%")
          wind = number(current.get("wind_speed_10m"), " км/ч")
          rain = number(current.get("precipitation"), " мм")
          high = number((daily.get("temperature_2m_max") or [None])[0], "°C")
          low = number((daily.get("temperature_2m_min") or [None])[0], "°C")
          rain_chance = number((daily.get("precipitation_probability_max") or [None])[0], "%")

          now = datetime.now(ZoneInfo(timezone))
          date_label = now.strftime("%d.%m.%Y")
          weekday_ru = {
              "Monday": "Понедельник", "Tuesday": "Вторник", "Wednesday": "Среда",
              "Thursday": "Четверг", "Friday": "Пятница", "Saturday": "Суббота",
              "Sunday": "Воскресенье",
          }.get(now.strftime("%A"), now.strftime("%A"))

          message = (
              "☁️ <b>ALFA WEATHER</b>\n"
              f"📍 <b>{html.escape(str(resolved_city))}</b>\n"
              f"📅 {weekday_ru}, {date_label}\n\n"
              f"🌡 Сейчас: <b>{temperature}</b>\n"
              f"🤔 Ощущается как: {feels_like}\n"
              f"🌤 {html.escape(str(description))}\n\n"
              f"⬆️ Максимум: {high}\n"
              f"⬇️ Минимум: {low}\n"
              f"🌧 Вероятность осадков: {rain_chance}\n"
              f"💧 Влажность: {humidity}\n"
              f"💨 Ветер: {wind}\n"
              f"🌧 Осадки сейчас: {rain}\n\n"
              "<i>Хорошего дня! Прогноз: Open-Meteo</i>"
          )

          telegram_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          sent = 0
          failed = 0

          for chat_id in chat_ids:
              try:
                  response = requests.post(
                      telegram_url,
                      json={
                          "chat_id": chat_id,
                          "text": message,
                          "parse_mode": "HTML",
                          "disable_web_page_preview": True,
                      },
                      timeout=(15, 45),
                  )
                  response.raise_for_status()
                  result = response.json()
                  if not result.get("ok"):
                      raise RuntimeError(str(result))
                  sent += 1
                  print(f"Forecast sent successfully to chat {chat_id}.")
              except Exception as exc:
                  failed += 1
                  print(f"Could not send to chat {chat_id}: {exc}")

          print(f"Finished. Sent: {sent}; failed: {failed}; total: {len(chat_ids)}.")
          if sent == 0:
              fail("Forecast was not delivered to any subscriber.")
          PY
