name: ALFA WEATHER Morning Forecast

on:
  workflow_dispatch:
  schedule:
    # 07:00 Moscow time (UTC+3)
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  group: alfa-weather-morning-forecast
  cancel-in-progress: false

jobs:
  send-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done
          echo "All required secrets are present."

      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Build and send weather forecast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python <<'PY'
          import os
          import sys
          import html
          import requests
          from datetime import datetime
          from zoneinfo import ZoneInfo

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          def safe_text(value):
              return html.escape(str(value or ""))

          # Accept either the project root URL or a Data API URL ending in /rest/v1.
          supabase_url = os.environ["SUPABASE_URL"].strip().rstrip("/")
          if supabase_url.endswith("/rest/v1"):
              supabase_url = supabase_url[:-len("/rest/v1")]
          supabase_key = os.environ["SUPABASE_ANON_KEY"]
          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          headers = {
              "apikey": supabase_key,
              "Authorization": f"Bearer {supabase_key}",
              "Accept": "application/json",
              "Accept-Profile": "public",
          }

          # This table has only: id, city, updated_at, timezone.
          try:
              settings_response = requests.get(
                  f"{supabase_url}/rest/v1/weather_settings",
                  headers=headers,
                  params={
                      "select": "city,timezone",
                      "id": "eq.1",
                      "limit": "1",
                  },
                  timeout=20,
              )
              if not settings_response.ok:
                  body = settings_response.text[:700].replace("\n", " ")
                  fail(
                      "Supabase settings request failed "
                      f"(HTTP {settings_response.status_code}). "
                      f"Response: {body}. Check that SUPABASE_URL is the project "
                      "root URL (not a dashboard URL), and that public.weather_settings "
                      "is exposed in the Data API."
                  )
              rows = settings_response.json()
          except requests.RequestException as exc:
              fail(f"Could not connect to Supabase: {exc}")
          except ValueError:
              fail("Supabase returned a response that was not valid JSON.")

          if not rows:
              fail("No row with id=1 found in public.weather_settings.")

          settings = rows[0]
          city = (settings.get("city") or "Москва").strip()
          timezone = (settings.get("timezone") or "Europe/Moscow").strip()

          try:
              ZoneInfo(timezone)
          except Exception:
              print(f"Invalid timezone {timezone}; using Europe/Moscow.")
              timezone = "Europe/Moscow"

          # Resolve city coordinates automatically; no latitude/longitude columns needed.
          try:
              geo_response = requests.get(
                  "https://geocoding-api.open-meteo.com/v1/search",
                  params={
                      "name": city,
                      "count": 1,
                      "language": "ru",
                      "format": "json",
                  },
                  timeout=20,
              )
              geo_response.raise_for_status()
              geo_results = geo_response.json().get("results") or []
          except Exception as exc:
              fail(f"Could not find coordinates for city '{city}': {exc}")

          if not geo_results:
              fail(f"City '{city}' was not found by Open-Meteo geocoding.")

          latitude = geo_results[0]["latitude"]
          longitude = geo_results[0]["longitude"]

          weather_params = {
              "latitude": latitude,
              "longitude": longitude,
              "current": (
                  "temperature_2m,apparent_temperature,relative_humidity_2m,"
                  "precipitation,weather_code,wind_speed_10m"
              ),
              "daily": (
                  "weather_code,temperature_2m_max,temperature_2m_min,"
                  "precipitation_probability_max"
              ),
              "forecast_days": 1,
              "timezone": timezone,
          }

          try:
              weather_response = requests.get(
                  "https://api.open-meteo.com/v1/forecast",
                  params=weather_params,
                  timeout=20,
              )
              weather_response.raise_for_status()
              weather = weather_response.json()
          except Exception as exc:
              fail(f"Could not fetch Open-Meteo forecast: {exc}")

          current = weather.get("current", {})
          daily = weather.get("daily", {})

          def number(value, suffix=""):
              if value is None:
                  return "—"
              try:
                  return f"{round(float(value))}{suffix}"
              except (TypeError, ValueError):
                  return "—"

          descriptions = {
              0: "Ясно",
              1: "Преимущественно ясно",
              2: "Переменная облачность",
              3: "Пасмурно",
              45: "Туман",
              48: "Изморозь",
              51: "Лёгкая морось",
              53: "Морось",
              55: "Сильная морось",
              56: "Ледяная морось",
              57: "Сильная ледяная морось",
              61: "Небольшой дождь",
              63: "Дождь",
              65: "Сильный дождь",
              66: "Ледяной дождь",
              67: "Сильный ледяной дождь",
              71: "Небольшой снег",
              73: "Снег",
              75: "Сильный снег",
              77: "Снежные зёрна",
              80: "Кратковременный дождь",
              81: "Ливень",
              82: "Сильный ливень",
              85: "Снегопад",
              86: "Сильный снегопад",
              95: "Гроза",
              96: "Гроза с небольшим градом",
              99: "Гроза с сильным градом",
          }

          code = current.get("weather_code")
          description = descriptions.get(code, "Погодные условия")
          temperature = number(current.get("temperature_2m"), "°C")
          feels_like = number(current.get("apparent_temperature"), "°C")
          humidity = number(current.get("relative_humidity_2m"), "%")
          wind = number(current.get("wind_speed_10m"), " км/ч")
          rain = number(current.get("precipitation"), " мм")
          high = number((daily.get("temperature_2m_max") or [None])[0], "°C")
          low = number((daily.get("temperature_2m_min") or [None])[0], "°C")
          rain_chance = number(
              (daily.get("precipitation_probability_max") or [None])[0], "%"
          )

          now = datetime.now(ZoneInfo(timezone))
          date_label = now.strftime("%d.%m.%Y")
          weekday_ru = {
              "Monday": "Понедельник",
              "Tuesday": "Вторник",
              "Wednesday": "Среда",
              "Thursday": "Четверг",
              "Friday": "Пятница",
              "Saturday": "Суббота",
              "Sunday": "Воскресенье",
          }.get(now.strftime("%A"), now.strftime("%A"))

          message = (
              "☁️ <b>ALFA WEATHER</b>\n"
              f"📍 <b>{safe_text(city)}</b>\n"
              f"📅 {weekday_ru}, {date_label}\n\n"
              f"🌡 Сейчас: <b>{temperature}</b>\n"
              f"🤔 Ощущается как: {feels_like}\n"
              f"🌤 {safe_text(description)}\n\n"
              f"⬆️ Максимум: {high}\n"
              f"⬇️ Минимум: {low}\n"
              f"🌧 Вероятность осадков: {rain_chance}\n"
              f"💧 Влажность: {humidity}\n"
              f"💨 Ветер: {wind}\n"
              f"🌧 Осадки сейчас: {rain}\n\n"
              "<i>Хорошего дня! Прогноз: Open-Meteo</i>"
          )

          try:
              telegram_response = requests.post(
                  f"https://api.telegram.org/bot{bot_token}/sendMessage",
                  json={
                      "chat_id": chat_id,
                      "text": message,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": True,
                  },
                  timeout=20,
              )
              telegram_response.raise_for_status()
              telegram_result = telegram_response.json()
          except Exception as exc:
              fail(f"Telegram request failed: {exc}")

          if not telegram_result.get("ok"):
              fail(f"Telegram API returned an error: {telegram_result}")

          print("Прогноз успешно отправлен в Telegram.")
          print(f"Город: {city}")
          PY
