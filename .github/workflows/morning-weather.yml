name: ALFA WEATHER Morning Forecast

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python -m pip install requests

      - name: Get weather and send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests
          from html import escape

          required = [
              "TELEGRAM_BOT_TOKEN",
              "TELEGRAM_CHAT_ID",
              "SUPABASE_URL",
              "SUPABASE_ANON_KEY",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise RuntimeError(
                  "Не заданы GitHub Secrets: " + ", ".join(missing)
              )

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          supabase_url = os.environ["SUPABASE_URL"].rstrip("/")
          supabase_key = os.environ["SUPABASE_ANON_KEY"]

          headers = {
              "apikey": supabase_key,
              "Authorization": f"Bearer {supabase_key}",
          }

          settings_response = requests.get(
              f"{supabase_url}/rest/v1/weather_settings",
              params={
                  "id": "eq.1",
                  "select": "city,latitude,longitude,timezone",
              },
              headers=headers,
              timeout=30,
          )
          settings_response.raise_for_status()
          rows = settings_response.json()

          if not rows:
              raise RuntimeError(
                  "В Supabase не найдена строка weather_settings с id=1."
              )

          settings = rows[0]
          city = settings.get("city") or "Выбранный город"
          latitude = settings.get("latitude")
          longitude = settings.get("longitude")
          timezone = settings.get("timezone") or "Europe/Moscow"

          if latitude is None or longitude is None:
              raise RuntimeError(
                  "В Supabase у выбранного города отсутствуют latitude/longitude. "
                  "Откройте приложение, выберите город и сохраните его ещё раз."
              )

          weather_response = requests.get(
              "https://api.open-meteo.com/v1/forecast",
              params={
                  "latitude": latitude,
                  "longitude": longitude,
                  "current": (
                      "temperature_2m,apparent_temperature,"
                      "relative_humidity_2m,wind_speed_10m,"
                      "precipitation,weather_code"
                  ),
                  "daily": (
                      "weather_code,temperature_2m_max,"
                      "temperature_2m_min,precipitation_probability_max"
                  ),
                  "timezone": timezone,
                  "forecast_days": 1,
              },
              timeout=30,
          )
          weather_response.raise_for_status()
          data = weather_response.json()

          descriptions = {
              0: "Ясно",
              1: "Преимущественно ясно",
              2: "Переменная облачность",
              3: "Пасмурно",
              45: "Туман",
              48: "Туман",
              51: "Морось",
              53: "Морось",
              55: "Сильная морось",
              56: "Ледяная морось",
              57: "Сильная ледяная морось",
              61: "Небольшой дождь",
              63: "Дождь",
              65: "Сильный дождь",
              66: "Ледяной дождь",
              67: "Сильный ледяной дождь",
              71: "Небольшой снег",
              73: "Снег",
              75: "Сильный снег",
              77: "Снежные зёрна",
              80: "Небольшой ливень",
              81: "Ливень",
              82: "Сильный ливень",
              85: "Небольшой снегопад",
              86: "Сильный снегопад",
              95: "Гроза",
              96: "Гроза с градом",
              99: "Сильная гроза с градом",
          }

          current = data["current"]
          daily = data["daily"]

          temp = round(current["temperature_2m"])
          feels = round(current["apparent_temperature"])
          humidity = current["relative_humidity_2m"]
          wind = round(current["wind_speed_10m"])
          precipitation = current["precipitation"]
          maximum = round(daily["temperature_2m_max"][0])
          minimum = round(daily["temperature_2m_min"][0])
          rain = daily["precipitation_probability_max"][0]

          current_description = descriptions.get(
              current["weather_code"], "Переменная погода"
          )
          today_description = descriptions.get(
              daily["weather_code"][0], "Переменная погода"
          )

          message = (
              "☁️ <b>ALFA WEATHER</b>\n"
              "━━━━━━━━━━━━━━\n"
              f"📍 <b>{escape(str(city))}</b>\n\n"
              f"🌤 {current_description}\n"
              f"🌡 Температура: <b>{temp:+}°C</b>\n"
              f"🤔 Ощущается как: {feels:+}°C\n\n"
              "📅 <b>Прогноз на сегодня</b>\n"
              f"• {today_description}\n"
              f"• От {minimum:+}°C до {maximum:+}°C\n"
              f"• Вероятность осадков: {rain}%\n\n"
              "💨 <b>Сейчас</b>\n"
              f"• Ветер: {wind} км/ч\n"
              f"• Влажность: {humidity}%\n"
              f"• Осадки: {precipitation} мм\n"
              "━━━━━━━━━━━━━━\n"
              "Хорошего дня! 💙"
          )

          telegram_response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": message,
                  "parse_mode": "HTML",
              },
              timeout=30,
          )
          telegram_response.raise_for_status()
          telegram_result = telegram_response.json()

          if not telegram_result.get("ok"):
              raise RuntimeError(
                  "Telegram вернул ошибку: "
                  + str(telegram_result.get("description", "неизвестная ошибка"))
              )

          print("Прогноз успешно отправлен в Telegram.")
          PY
