
name: ALFA WEATHER — утренний прогноз

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  send-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Send morning weather
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

        run: |
          python - <<'PY'
          import os
          import requests
          from html import escape

          def fail(message):
              raise SystemExit(message)

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          supabase_url = os.environ["SUPABASE_URL"].rstrip("/")
          supabase_key = os.environ["SUPABASE_ANON_KEY"]

          headers = {
              "apikey": supabase_key,
              "Authorization": f"Bearer {supabase_key}"
          }

          response = requests.get(
              f"{supabase_url}/rest/v1/weather_settings",
              params={
                  "id": "eq.1",
                  "select": "city,admin1,country,latitude,longitude,timezone"
              },
              headers=headers,
              timeout=20
          )
          response.raise_for_status()
          rows = response.json()

          if not rows:
              fail("В Supabase не найдены настройки города.")

          settings = rows[0]
          city = settings.get("city") or "Ваш город"
          latitude = settings.get("latitude")
          longitude = settings.get("longitude")
          timezone = settings.get("timezone") or "Europe/Moscow"

          if latitude is None or longitude is None:
              fail("Нет координат города. Открой сайт и выбери город заново.")

          weather_response = requests.get(
              "https://api.open-meteo.com/v1/forecast",
              params={
                  "latitude": latitude,
                  "longitude": longitude,
                  "current": "temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,precipitation,weather_code",
                  "daily": "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
                  "timezone": timezone,
                  "forecast_days": 1
              },
              timeout=20
          )
          weather_response.raise_for_status()
          weather = weather_response.json()

          descriptions = {
              0: "Ясно",
              1: "Преимущественно ясно",
              2: "Переменная облачность",
              3: "Пасмурно",
              45: "Туман",
              48: "Изморозь",
              51: "Лёгкая морось",
              53: "Морось",
              55: "Сильная морось",
              61: "Небольшой дождь",
              63: "Дождь",
              65: "Сильный дождь",
              71: "Небольшой снег",
              73: "Снег",
              75: "Сильный снег",
              80: "Ливень",
              81: "Сильный ливень",
              82: "Очень сильный ливень",
              95: "Гроза",
              96: "Гроза с градом",
              99: "Сильная гроза с градом"
          }

          current = weather["current"]
          daily = weather["daily"]

          code = current["weather_code"]
          description = descriptions.get(code, "Переменная погода")

          temp = round(current["temperature_2m"])
          feels = round(current["apparent_temperature"])
          humidity = current["relative_humidity_2m"]
          wind = round(current["wind_speed_10m"])
          precipitation = current["precipitation"]

          max_temp = round(daily["temperature_2m_max"][0])
          min_temp = round(daily["temperature_2m_min"][0])
          rain_chance = daily["precipitation_probability_max"][0]
          daily_description = descriptions.get(
              daily["weather_code"][0], "Переменная погода"
          )

          message = (
              "☁️ <b>ALFA WEATHER</b>\n"
              "━━━━━━━━━━━━━━\n"
              f"📍 <b>{escape(city)}</b>\n\n"
              f"🌤 <b>{description}</b>\n"
              f"🌡 Температура: <b>{temp:+}°C</b>\n"
              f"🤔 Ощущается как: {feels:+}°C\n\n"
              "📅 <b>Прогноз на сегодня</b>\n"
              f"• {daily_description}\n"
              f"• Температура: {min_temp:+}°C ... {max_temp:+}°C\n"
              f"• Вероятность осадков: {rain_chance}%\n\n"
              "💨 <b>Сейчас</b>\n"
              f"• Ветер: {wind} км/ч\n"
              f"• Влажность: {humidity}%\n"
              f"• Осадки: {precipitation} мм\n"
              "━━━━━━━━━━━━━━\n"
              "Хорошего дня! 💙"
          )

          telegram_response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": message,
                  "parse_mode": "HTML"
              },
              timeout=20
          )
          telegram_response.raise_for_status()

          if not telegram_response.json().get("ok"):
              fail("Telegram не подтвердил отправку сообщения.")

          print("Прогноз успешно отправлен.")
          PY
